[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "integration: exercises the real Flow, tasks, and extraction end to end (still offline).",
]
asyncio_mode = "auto"
testpaths = ["tests"]
